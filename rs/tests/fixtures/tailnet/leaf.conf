# NATS leaf — shares os-node-b's netns; dials the hub over the tailnet.
# No token: the tailnet IS the auth layer (the inference.club insight).
listen: 0.0.0.0:4222
http_port: 8222
jetstream { store_dir: /tmp/js-leaf, max_file: 4GB }
leafnodes { remotes [ { url: "nats://100.64.0.1:7422" } ] }

ping_interval: "5s"
ping_max: 2
