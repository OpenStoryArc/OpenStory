# Test compose: openclaw-mcp (Rust MCP) + open-story + NATS.
#
# Verifies the openclaw-mcp image — produced by Dockerfile.openclaw —
# contains the Rust open-story-mcp binary and can serve tool calls
# against a shared SQLite store reached over the Docker network.
#
# Architecture under test:
#
#   openclaw-mcp (idle until exec'd)
#        │  exec /usr/local/bin/open-story-mcp via docker exec
#        ▼
#   open-story-mcp subprocess  ───NATS────▶  nats
#                              ───SQLite──▶  os-data ◀── open-story writes here
#                                            (shared volume, ro on the MCP side)
#
# The open-story writer uses SQLite here (not Mongo) to keep the test
# stack lean and match the layout of docker-compose.{agent,prod}.yml.
# The openclaw-mcp reader doesn't open a backend at all — it reads the
# writer's data over the REST API (HttpEventStore, PR #88), so the
# backend choice is the writer's alone.
#
# Prerequisites:
#   docker build -t open-story:test ./rs
#   docker build -f Dockerfile.openclaw -t openclaw-mcp:latest .

services:
  nats:
    image: nats:2.10
    command: ["-js"]

  open-story:
    image: open-story:test
    command:
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "3002"
      - "--data-dir"
      - "/data"
      - "--watch-dir"
      - "/watch"
    environment:
      # NB: the server reads NATS_URL (no OPEN_STORY_ prefix) while the
      # Rust MCP below reads OPENSTORY_NATS_URL. Asymmetric on purpose —
      # NATS_URL is the canonical NATS env var the server inherits.
      - NATS_URL=nats://nats:4222
    ports:
      - "3002"
    volumes:
      - os-data:/data
      - ${FIXTURE_DIR:-.}:/watch:ro
    depends_on:
      - nats

  openclaw-mcp:
    image: openclaw-mcp:latest
    # Idle container — tests exec the Rust MCP via `docker exec`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "tail -f /dev/null"
    environment:
      - OPENSTORY_NATS_URL=nats://nats:4222
      - OPENSTORY_DATA_BACKEND=sqlite
      - OPENSTORY_DATA_DIR=/os-data
    volumes:
      # Same volume open-story writes to, mounted read-only here so the
      # MCP can query the SQLite store. subscribe_* tools still flow via
      # NATS, not this volume.
      - os-data:/os-data:ro
    depends_on:
      - nats
      - open-story

volumes:
  os-data:
