[package]
name = "open-story-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust-native MCP server for open-story — streaming subscriptions + query tools, no Python in the path"

[[bin]]
name = "open-story-mcp"
path = "src/bin/open-story-mcp.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
open-story-bus = { path = "../bus" }
open-story-core = { path = "../core" }
open-story-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-nats = "0.38"
async-trait = "0.1"
tempfile = "3"
testcontainers = { version = "0.27.2", features = ["http_wait"] }
tokio = { version = "1", features = ["full"] }
