[package]
name = "open-story-shapes"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic shape-layer projections for open-story — per-event structural shapes (path / bash / change) over the CloudEvent stream"

[dependencies]
open-story-core = { path = "../core" }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
