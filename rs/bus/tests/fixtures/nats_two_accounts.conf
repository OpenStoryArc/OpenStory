## Two-account NATS server config for multi-account isolation tests.
##
## Subjects published from PERSON_MAX's account are invisible to clients
## connected to PERSON_KATIE's account (and vice versa) — the default
## semantics for distinct NATS accounts, with no exports/imports declared.
##
## This file is bind-mounted into the testcontainer at /etc/nats/nats-server.conf
## and selected via `-c /etc/nats/nats-server.conf`.

listen: 0.0.0.0:4222

accounts {
  PERSON_MAX: {
    users: [
      { user: "max", password: "max-secret" }
    ]
  }
  PERSON_KATIE: {
    users: [
      { user: "katie", password: "katie-secret" }
    ]
  }
}
