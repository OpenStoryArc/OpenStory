[package]
name = "open-story-views"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "CloudEvent to ViewRecord transform layer for open-story"
repository = "https://github.com/OpenStoryArc/OpenStory"

[dependencies]
open-story-core = { path = "../core" }
# default-features = false drops jsonschema's remote `$ref` HTTP resolution
# (which pulls reqwest -> native-tls -> openssl-sys, a native OpenSSL build dep).
# We only ever validate against an embedded, compile-time schema
# (`validator_for` in from_cloud_event.rs), never a remote one.
jsonschema = { version = "0.28", default-features = false }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.12"

[dev-dependencies]
serde_json = "1"
