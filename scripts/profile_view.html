<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Story · Developer Profile</title>
<style>
  /* ── Design surface. Edit freely — the page hot-reloads on save. ── */
  :root {
    --bg: #0b0d10;
    --panel: #12161c;
    --line: #222a33;
    --ink: #e8edf2;
    --muted: #7d8a99;
    --accent: #5ad1c5;   /* OpenStory teal */
    --warn: #f2b15a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--mono); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 40px 24px 80px; }

  header { display: flex; align-items: baseline; justify-content: space-between;
           border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  .brand { letter-spacing: .18em; font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .local { font-size: 11px; color: var(--accent); border: 1px solid var(--accent);
           border-radius: 999px; padding: 3px 10px; }

  .hero { margin: 36px 0 8px; }
  .hero .archetype { font-size: 40px; font-weight: 700; letter-spacing: -.01em; }
  .hero .rationale { color: var(--muted); margin-top: 6px; font-size: 14px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 32px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .panel h2 { margin: 0 0 16px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  /* radar */
  #radar { width: 100%; height: auto; display: block; }
  .radar-poly { fill: rgba(90,209,197,.16); stroke: var(--accent); stroke-width: 2; }
  .radar-grid { fill: none; stroke: var(--line); stroke-width: 1; }
  .radar-axis { stroke: var(--line); stroke-width: 1; }
  .radar-label { fill: var(--muted); font-size: 11px; }
  .radar-dot { fill: var(--accent); }

  /* bars */
  .bar-row { display: grid; grid-template-columns: 96px 1fr 40px; align-items: center; gap: 12px; margin: 12px 0; }
  .bar-row .name { font-size: 13px; color: var(--ink); text-transform: capitalize; }
  .bar-track { display: block; background: #0a0c0f; border: 1px solid var(--line);
               border-radius: 6px; height: 12px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #3fa99f);
              border-radius: 6px 0 0 6px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .bar-row .val { font-size: 13px; color: var(--muted); text-align: right; }
  .bar-row.low .bar-fill { background: linear-gradient(90deg, var(--warn), #c98a3a); }

  /* signature */
  .sig { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  .sig .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .sig .v { font-size: 17px; margin-top: 2px; }

  .edge { margin-top: 28px; border: 1px solid var(--warn); border-radius: 14px; padding: 18px 22px;
          background: rgba(242,177,90,.06); }
  .edge .lbl { color: var(--warn); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .edge .txt { margin-top: 6px; font-size: 15px; }

  /* toolbar */
  .toolbar { display: flex; gap: 14px; align-items: center; margin-top: 34px; flex-wrap: wrap;
             color: var(--muted); font-size: 12px; }
  .toolbar input { width: 64px; background: #0a0c0f; border: 1px solid var(--line); color: var(--ink);
                   font-family: var(--mono); border-radius: 6px; padding: 6px 8px; }
  .toolbar button { background: var(--accent); color: #04201d; border: 0; border-radius: 6px;
                    padding: 7px 14px; font-family: var(--mono); font-weight: 600; cursor: pointer; }
  .toolbar button:disabled { opacity: .5; cursor: default; }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.off { background: var(--muted); box-shadow: none; }

  .loading { color: var(--muted); font-size: 13px; }
  .err { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Open Story · Developer Profile</span>
    <span class="local">local-only · nothing leaves this machine</span>
  </header>

  <div id="content"><p class="loading">Computing profile from your event store…</p></div>

  <div class="toolbar">
    <label>days <input id="days" type="number" value="30" min="1" /></label>
    <label>sample <input id="sample" type="number" value="50" min="5" /></label>
    <button id="recompute">Recompute</button>
    <span class="live"><span id="livedot" class="dot"></span><span id="livetext">live reload on</span></span>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);

function bar(name, val, isLow) {
  const pct = Math.max(0, Math.min(100, val * 10));
  return `<div class="bar-row ${isLow ? "low" : ""}">
    <span class="name">${name}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
    <span class="val">${val.toFixed(1)}</span>
  </div>`;
}

// Pentagon radar, vanilla SVG. dims in order, scores 0–10.
function radar(dims, scores) {
  const size = 280, cx = size / 2, cy = size / 2, R = 100;
  const n = dims.length;
  const ang = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];

  let rings = "";
  for (let g = 2; g <= 10; g += 2) {
    const pts = dims.map((_, i) => pt(i, (R * g) / 10).map((v) => v.toFixed(1)).join(",")).join(" ");
    rings += `<polygon class="radar-grid" points="${pts}" />`;
  }
  let axes = "", labels = "";
  dims.forEach((d, i) => {
    const [x, y] = pt(i, R);
    axes += `<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" />`;
    const [lx, ly] = pt(i, R + 22);
    const anchor = Math.abs(lx - cx) < 6 ? "middle" : lx > cx ? "start" : "end";
    labels += `<text class="radar-label" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}">${d}</text>`;
  });
  const poly = dims.map((d, i) => pt(i, (R * scores[d]) / 10).map((v) => v.toFixed(1)).join(",")).join(" ");
  const dots = dims.map((d, i) => { const [x, y] = pt(i, (R * scores[d]) / 10);
    return `<circle class="radar-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" />`; }).join("");

  // Pad the viewBox horizontally so axis labels (e.g. "planning") never clip.
  return `<svg id="radar" viewBox="-54 -8 ${size + 108} ${size + 24}" role="img" aria-label="dimension radar">
    ${rings}${axes}<polygon class="radar-poly" points="${poly}" />${dots}${labels}
  </svg>`;
}

function render(p) {
  if (p.empty) {
    $("#content").innerHTML = `<p class="err">No sessions in the last ${p.days} days. Is OpenStory running?</p>`;
    return;
  }
  const m = p.metrics, dims = p.dimensions, edge = p.growth_edge;
  const agents = Object.entries(m.agent_mix).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `${k} ×${v}`).join(", ");

  $("#content").innerHTML = `
    <div class="hero">
      <div class="archetype">${p.archetype}</div>
      <div class="rationale">${p.rationale}</div>
    </div>
    <div class="grid">
      <div class="panel">
        <h2>Five dimensions</h2>
        ${radar(dims, p.scores)}
      </div>
      <div class="panel">
        <h2>Scores</h2>
        ${dims.map((d) => bar(d, p.scores[d], d === edge)).join("")}
      </div>
    </div>
    <div class="panel" style="margin-top:28px">
      <h2>Signature</h2>
      <div class="sig">
        <div><div class="k">sessions</div><div class="v">${m.session_count} · ${m.total_events.toLocaleString()} events</div></div>
        <div><div class="k">peak hour</div><div class="v">${String(m.peak_hour).padStart(2,"0")}:00 · ${Math.round(m.night_fraction*100)}% nocturnal</div></div>
        <div><div class="k">main project</div><div class="v">${m.top_project} <span style="color:var(--muted)">(of ${m.project_count})</span></div></div>
        <div><div class="k">throughput</div><div class="v">${Math.round(m.avg_tools_per_session)} tool-calls / session</div></div>
        <div style="grid-column:1/-1"><div class="k">agents</div><div class="v">${agents}</div></div>
      </div>
    </div>
    <div class="edge">
      <div class="lbl">Growth edge</div>
      <div class="txt"><strong style="text-transform:capitalize">${edge}</strong> — your lowest dimension (${p.scores[edge].toFixed(1)}). Where the next 10× is.</div>
    </div>`;
}

// refresh=false uses the server's cached profile (instant) — that keeps the
// design loop snappy: editing the HTML reloads the page against cached data.
// Only the Recompute button forces a re-pull from the event store.
async function load(refresh) {
  const btn = $("#recompute");
  btn.disabled = true; btn.textContent = refresh ? "Computing…" : "Loading…";
  const days = $("#days").value, sample = $("#sample").value;
  try {
    const r = await fetch(`/api/profile.json?days=${days}&sample=${sample}&refresh=${refresh ? 1 : 0}`);
    render(await r.json());
  } catch (e) {
    $("#content").innerHTML = `<p class="err">Failed to load profile: ${e}. Is the view server running?</p>`;
  } finally {
    btn.disabled = false; btn.textContent = "Recompute";
  }
}

$("#recompute").addEventListener("click", () => load(true));

// ── Live reload via Server-Sent Events. The dev server pushes "reload"
//    whenever this file changes on disk, so design edits appear instantly. ──
try {
  const es = new EventSource("/events");
  es.onmessage = (e) => { if (e.data === "reload") location.reload(); };
  es.onerror = () => { $("#livedot").classList.add("off"); $("#livetext").textContent = "live reload off"; };
} catch (_) {}

load(false);  // first paint from cache (server computes once on cold start)
</script>
</body>
</html>
