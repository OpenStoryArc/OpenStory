# NATS hub — shares os-node-a's netns, so it listens on the tailnet IP (100.64.0.1).
listen: 0.0.0.0:4222
http_port: 8222
jetstream { store_dir: /tmp/js-hub, max_file: 4GB }

# SECURITY: advertise ONLY the tailnet address. Without this, the hub gossips its
# other interfaces (e.g. the docker-bridge 172.x) to the leaf via connect_urls,
# and a severed tailnet lets the leaf reconnect over the bridge — bypassing the
# tailnet ACL boundary entirely. Pinning the advertised address binds federation
# strictly to the tailnet. (Discovered by the E3 ablation: the leaf fell back to
# 172.x:7422 when tailscale0 was cut.)
leafnodes { listen: 0.0.0.0:7422, advertise: "100.64.0.1:7422" }

ping_interval: "5s"
ping_max: 2
