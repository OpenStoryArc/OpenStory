# SOPS-encrypted secrets for the single-host profile.
#
# This file is a placeholder. Operators populate it via:
#
#   sops --encrypt --in-place docs/research/lab/secrets/single-host.enc.yaml
#
# (after first writing plaintext keys to this file, locally, and ensuring
# `.sops.yaml` at the repo root lists each operator's age public key).
#
# Keys consumed by the lab host (see hosts/lab-host.nix):
#
#   openstory:
#     api_token:  "<random hex token, 32+ chars; rotate on schedule>"
#     db_key:     "<SQLCipher key, 64-char hex>"
#   nats:
#     leaf_token: "<used by docker-compose deploy; kept here for parity>"
#
# DO NOT COMMIT plaintext to this file. SOPS rejects unencrypted files
# in pre-commit hook (set up `.sops.yaml` + `pre-commit` via README).
