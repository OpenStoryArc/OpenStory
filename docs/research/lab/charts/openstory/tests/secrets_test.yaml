suite: secrets are referenced, never inline
templates:
  - deployment.yaml
  - configmap.yaml
tests:
  - it: deployment references API token via secretKeyRef
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPEN_STORY_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: openstory-secrets
                key: api_token

  - it: deployment references DB key via secretKeyRef
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPEN_STORY_DB_KEY
            valueFrom:
              secretKeyRef:
                name: openstory-secrets
                key: db_key

  - it: configmap does not contain api_token or db_key
    template: configmap.yaml
    asserts:
      - notExists:
          path: data.OPEN_STORY_API_TOKEN
      - notExists:
          path: data.OPEN_STORY_DB_KEY
