apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstory.fullname" . }}
  labels:
    {{- include "openstory.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # data dir is hostPath; can't run two instances
  selector:
    matchLabels:
      {{- include "openstory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openstory.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: openstory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "openstory.fullname" . }}-config
          env:
            # Sensitive values come from the Secret only — never inline.
            # OPA policy api-token-required.rego asserts these are present.
            - name: OPEN_STORY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.apiTokenSecretRef.name }}
                  key: {{ .Values.security.apiTokenSecretRef.key }}
            - name: OPEN_STORY_DB_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.dbKeySecretRef.name }}
                  key: {{ .Values.security.dbKeySecretRef.key }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.storage.dataDir }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.storage.hostPath }}
            type: DirectoryOrCreate
