# The sidecar's JetStream leaf (K-03): the shape `render_leaf_config` emits
# for a managed leaf, with the store on its own PVC and the hub URL from
# the openstory-leaf Secret. Loopback only inside the pod.
listen: 127.0.0.1:4222

jetstream {
    store_dir: "/jetstream"
    max_mem: 256MB
    max_file: 4GB
}

max_payload: 8MB
http_port: 8222

leafnodes {
    remotes [
        { url: $NATS_LEAF_URL }
    ]
}
