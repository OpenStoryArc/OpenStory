name: Build Homebrew bottles

# Tag push (or manual dispatch) builds macOS bottles for `openstory` and attaches
# them to a DRAFT GitHub Release, then emits the `bottle do` block for the tap.
#
# Why a draft: published releases are immutable in this org, so `gh release
# upload` onto an already-published release 422s ("Cannot upload assets to an
# immutable release") — which is exactly how every prior bottle run failed. We
# build bottles into workflow artifacts (no release interaction), then a single
# publish job attaches them to a DRAFT and leaves it for a human to review and
# publish. Sealing happens on publish, after all assets are present.
#
# The build itself is ~3 min/arch. Earlier runs also burned the 24h ceiling on a
# hung Intel runner (no timeout); `timeout-minutes` + partial-success publishing
# fix that — the arm64 bottle ships even if macos-13 is flaky.
#
# After this runs: review the draft release, then paste the emitted `bottle do`
# block into Formula/openstory.rb in the tap (OpenStoryArc/homebrew-openstory)
# and publish. See docs — Phase 3 of the release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bottle (without leading v), e.g. 0.4.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bottle:
    name: Bottle on ${{ matrix.label }}
    # Was unbounded — a hung Intel runner burned the 24h Actions ceiling. The
    # build is ~3 min; 45 is generous headroom that still fails fast on a hang.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14         # Apple Silicon Sonoma
            label: arm64_sonoma
          # Intel (macos-13) is intentionally omitted: GitHub is retiring Intel
          # macOS runners, so the job sat un-scheduled and burned the 24h ceiling
          # (queued time isn't bounded by timeout-minutes). Apple Silicon covers
          # the vast majority; Intel Macs fall back to the source build. Re-add a
          # `- os: macos-13 / label: ventura` entry here if Intel bottles are
          # needed and runners are available.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        # Pass inputs via env, not direct ${{ }} interpolation — otherwise a
        # crafted workflow_dispatch input like `'; rm -rf / #` becomes literal
        # shell. See https://securitylab.github.com/research/github-actions-untrusted-input/
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Compute source tarball sha256
        id: sha
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
          # GitHub takes a moment to materialize the auto-archive after a tag push.
          for _ in 1 2 3 4 5; do
            sha=$(curl -sL --fail "$url" | shasum -a 256 | awk '{print $1}') && break
            sleep 5
          done
          test -n "$sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Set formula sha256 to the real tarball hash
        # The tag's Formula/openstory.rb should already carry the real url+sha
        # (release Phase 2). But pin it to the freshly-computed hash regardless,
        # so bottling can never build against a stale/placeholder sha.
        run: |
          sed -i.bak -E \
            's/sha256 "[0-9a-f]{64}"/sha256 "${{ steps.sha.outputs.sha256 }}"/' \
            Formula/openstory.rb
          rm -f Formula/openstory.rb.bak
          grep -n 'sha256' Formula/openstory.rb | head -1

      - name: Stage formula as local tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/openstoryarc/homebrew-openstory/Formula"
          mkdir -p "$tap_dir"
          cp Formula/openstory.rb "$tap_dir/"

      - name: Audit formula
        run: brew audit --strict --online openstoryarc/openstory/openstory

      - name: Build + bottle
        run: |
          brew install --build-bottle openstoryarc/openstory/openstory
          brew bottle \
            --json \
            --no-rebuild \
            --root-url="https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}" \
            openstoryarc/openstory/openstory

      - name: Rename bottle to brew's expected filename
        # `brew bottle` produces files with `--` in the name when uploaded to a
        # third-party host; rename so the formula's bottle block resolves.
        run: |
          for f in *.bottle.tar.gz; do
            mv "$f" "$(echo "$f" | sed 's/openstory--/openstory-/')"
          done
          for f in *.bottle.json; do
            mv "$f" "$(echo "$f" | sed 's/openstory--/openstory-/')" 2>/dev/null || true
          done
          ls -lah *.bottle.*

      - name: Smoke-test the installed binary
        run: |
          brew test openstoryarc/openstory/openstory
          "$(brew --prefix openstoryarc/openstory/openstory)/bin/open-story" --help | head -20

      - name: Upload bottle as a workflow artifact
        # Decouples building from publishing — the immutable-release 422 only ever
        # happened at upload time. Here the matrix never touches the release.
        uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.label }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
          if-no-files-found: error

  publish:
    name: Attach bottles to draft release
    needs: bottle
    # Run whenever the matrix ran at all (success OR partial failure) — never
    # skip a good arm64 bottle because Intel was flaky. Skips only on cancel.
    if: ${{ always() && (needs.bottle.result == 'success' || needs.bottle.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Download bottle artifacts
        uses: actions/download-artifact@v4
        with:
          path: bottles
          pattern: bottle-*
          merge-multiple: true

      - name: List bottles (fail if none were produced)
        run: |
          ls -lah bottles/*.bottle.* || {
            echo "::error::No bottles were produced by any matrix job — nothing to publish."
            exit 1
          }

      - name: Ensure a DRAFT release exists (immutable-safe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Draft release $tag exists — will attach bottles."
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag is already PUBLISHED and immutable — assets can't be attached. Delete it and re-run so CI recreates it as a draft, or attach bottles before publishing."
            exit 1
          else
            gh release create "$tag" \
              --draft \
              --title "$tag" \
              --notes "Draft release — CI attaches the Homebrew bottles below. Review, add notes, then publish. (Publishing seals the assets — this org's releases are immutable once published.)"
            echo "Created draft release $tag."
          fi

      - name: Attach bottles to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          gh release upload "$tag" bottles/*.bottle.tar.gz bottles/*.bottle.json --clobber
          echo "Attached: $(ls bottles/*.bottle.tar.gz | wc -l) bottle(s)."

      - name: Emit the bottle do block for the tap
        run: |
          {
            echo "## \`bottle do\` block for the tap formula"
            echo ""
            echo "Paste into \`Formula/openstory.rb\` in OpenStoryArc/homebrew-openstory, then publish the draft release."
            echo ""
            echo '```ruby'
            echo "  bottle do"
            echo "    root_url \"https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}\""
            for f in bottles/*.bottle.json; do
              sha=$(jq -r '.. | objects | .sha256? // empty' "$f" | head -1)
              btag=$(jq -r '.. | objects | .tag? // empty' "$f" | head -1)
              if [ -n "$btag" ] && [ -n "$sha" ]; then
                echo "    sha256 cellar: :any_skip_relocation, ${btag}: \"$sha\""
              fi
            done
            echo "  end"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
